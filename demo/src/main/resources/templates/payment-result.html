<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Thanh Toán</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            width: 90%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
        }
        
        .header {
            padding: 25px 20px;
            margin-bottom: 20px;
        }
        
        .success-header {
            background: #4caf50;
            color: white;
        }
        
        .error-header {
            background: #f44336;
            color: white;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .icon {
            font-size: 60px;
            margin: 10px 0;
        }
        
        .content {
            padding: 0 20px 20px;
        }
        
        .message {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .redirect-message {
            font-size: 14px;
            color: #777;
            margin-top: 20px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #2196f3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <div class="container">
        <div th:class="${success} ? 'header success-header' : 'header error-header'">
            <div class="icon" th:text="${success} ? '✓' : '✗'"></div>
            <h1 th:text="${success} ? 'Thanh Toán Thành Công' : 'Thanh Toán Thất Bại'">Kết Quả Thanh Toán</h1>
        </div>
        
        <div class="content">
            <p class="message" th:text="${message}">Thông báo kết quả thanh toán sẽ hiển thị ở đây.</p>
            
            <a th:href="${redirectUrl}" class="btn">Trở Về Trang Chủ</a>
            
            <p class="redirect-message">Bạn sẽ được chuyển hướng tự động sau 5 giây...</p>
        </div>
    </div>
    
    <script th:inline="javascript">
        // Auto redirect after 5 seconds
        setTimeout(function() {
            window.location.href = /*[[${redirectUrl}]]*/ '/';
        }, 5000);
    </script>
</body>
</html>
