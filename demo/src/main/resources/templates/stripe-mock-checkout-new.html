<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeUp - Mock Stripe Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .checkout-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            color: #635bff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .mock-badge {
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .payment-details {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .payment-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
        }
        
        .payment-item:last-child {
            border-top: 2px solid #e9ecef;
            font-weight: bold;
            color: #495057;
            margin-top: 10px;
            padding-top: 15px;
            margin-bottom: 0;
        }
        
        .mock-card {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card-number {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 2px;
            color: #495057;
            margin-bottom: 10px;
        }
        
        .card-details {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6c757d;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        
        .processing {
            display: none;
            color: #6c757d;
            font-style: italic;
            margin-top: 20px;
        }
        
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #635bff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="logo">🔒 Stripe Checkout</div>
        <div class="mock-badge">MOCK MODE</div>
        
        <div class="payment-details">
            <div class="payment-item">
                <span>Sản phẩm:</span>
                <span th:text="${description}">TradeUp Purchase</span>
            </div>
            <div class="payment-item">
                <span>Số tiền:</span>
                <span th:text="${amount}">8,000 VND</span>
            </div>
            <div class="payment-item">
                <span>Phí xử lý:</span>
                <span>0 VND</span>
            </div>
            <div class="payment-item">
                <span>Tổng cộng:</span>
                <span th:text="${amount}">8,000 VND</span>
            </div>
        </div>
        
        <div class="mock-card">
            <div class="card-number">4242 4242 4242 4242</div>
            <div class="card-details">
                <span>Hết hạn: 12/28</span>
                <span>CVC: 123</span>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn btn-success" onclick="processPayment(true)">
                ✓ Thanh toán thành công
            </button>
            <button class="btn btn-danger" onclick="processPayment(false)">
                ✗ Hủy thanh toán
            </button>
        </div>
        
        <div class="processing" id="processing">
            <div class="spinner"></div>
            Đang xử lý thanh toán...
        </div>
        
        <div class="footer">
            <p><strong>Chế độ Mock:</strong> Đây là trang thanh toán giả lập cho mục đích test.</p>
            <p>Session ID: <span th:text="${sessionId}">cs_test_mock_...</span></p>
            <p>Payment ID: <span th:text="${paymentId}">123</span></p>
        </div>
    </div>

    <script>
        function processPayment(success) {
            // Show processing indicator
            document.getElementById('processing').style.display = 'block';
            document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
            
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            const paymentId = urlParams.get('payment_id');
            
            setTimeout(() => {
                if (success) {
                    // Simulate successful payment
                    window.location.href = `/api/v1/payments/success/stripe?session_id=${sessionId}&payment_id=${paymentId}`;
                } else {
                    // Simulate cancelled payment
                    window.location.href = `/api/v1/payments/cancel/stripe?payment_id=${paymentId}`;
                }
            }, 2000); // 2 second delay to simulate processing
        }
        
        // Auto-redirect after 60 seconds if no action
        setTimeout(() => {
            if (document.getElementById('processing').style.display === 'none') {
                alert('Phiên thanh toán sẽ hết hạn trong 5 giây...');
                setTimeout(() => {
                    processPayment(false);
                }, 5000);
            }
        }, 55000);
    </script>
</body>
</html>
